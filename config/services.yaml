parameters:

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $mailerFromAddress: '%env(MAILER_FROM_ADDRESS)%'
            string $mailerFromName: '%env(MAILER_FROM_NAME)%'
            string $jwtSecret: '%env(JWT_SECRET)%'
            string $jwtAlgorithm: '%env(JWT_ALGORITHM)%'
            int $accessTokenTtl: '%env(int:JWT_ACCESS_TOKEN_TTL)%'
            int $refreshTokenTtl: '%env(int:JWT_REFRESH_TOKEN_TTL)%'

    _instanceof:
        App\Shared\Domain\Bus\Command\CommandHandler:
            tags: [ 'app.command_handler' ]
        App\Shared\Domain\Bus\Query\QueryHandler:
            tags: [ 'app.query_handler' ]
        App\Shared\Domain\Bus\Event\DomainEventSubscriber:
            tags: [ 'app.domain_event_subscriber' ]

    App\:
        resource: '../src/'

    App\Shared\Infrastructure\Bus\Event\InMemorySymfonyEventBus:
        arguments: [ !tagged_iterator app.domain_event_subscriber ]
        lazy: true

    App\Shared\Infrastructure\Bus\Event\DomainEventMapping:
        arguments: [ !tagged_iterator app.domain_event_subscriber ]

    App\Shared\Infrastructure\Symfony\Middlewares\ExceptionListenerMiddleware:
        tags: [ { name: kernel.event_listener, event: kernel.exception, method: onKernelException, priority: 60 } ]

    App\Shared\Infrastructure\Symfony\Middlewares\HttpAuthMiddleware:
        tags: [ { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 20 } ]

    App\Shared\Infrastructure\Symfony\Middlewares\HttpRateLimitMiddleware:
        tags: [ { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 30 } ]

    App\Shared\Infrastructure\Symfony\Middlewares\HttpRolesMiddleware:
        tags: [ { name: kernel.event_listener, event: kernel.request, method: onKernelRequest, priority: 10 } ]

    App\Shared\Infrastructure\Bus\Command\InMemorySymfonyCommandBus:
        arguments: [ !tagged_iterator app.command_handler ]

    App\Shared\Infrastructure\Bus\Query\InMemorySymfonyQueryBus:
        arguments: [ !tagged_iterator app.query_handler ]

    App\Shared\Infrastructure\Logging\LokiHandler:
        arguments:
            $lokiUrl: '%env(LOKI_URL)%'
            $lokiUsername: '%env(LOKI_USERNAME)%'
            $lokiPassword: '%env(LOKI_PASSWORD)%'
            $defaultLabels:
                app: 'wargames-api'
                env: '%kernel.environment%'

    app.logging.business_loki_handler:
        class: App\Shared\Infrastructure\Logging\LokiHandler
        arguments:
            $lokiUrl: '%env(LOKI_URL)%'
            $lokiUsername: '%env(LOKI_USERNAME)%'
            $lokiPassword: '%env(LOKI_PASSWORD)%'
            $defaultLabels:
                app: 'wargames-api'
                env: '%kernel.environment%'
            $level: 'info'

    Doctrine\ORM\EntityManagerInterface:
        factory: [ App\Shared\Infrastructure\Persistence\Doctrine\EntityManagerFactory, create ]
        arguments:
            -   driver: '%env(MYSQL_DRIVER)%'
                host: '%env(MYSQL_HOST)%'
                port: '%env(MYSQL_PORT)%'
                dbname: '%env(MYSQL_DB)%'
                user: '%env(MYSQL_USER)%'
                password: '%env(MYSQL_PASSWORD)%'
            - '%env(APP_ENV)%'
        public: true

    App\Shared\Domain\Bus\Event\EventBus $syncEventBus: '@App\Shared\Infrastructure\Bus\Event\InMemorySymfonyEventBus'


